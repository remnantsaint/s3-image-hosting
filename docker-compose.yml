services:
  mysql:
    # 使用MySQL官方8.4镜像
    image: mysql:8.4
    container_name: s3-image-hosting-mysql
    restart: unless-stopped

    # Docker Compose会自动读取根目录中的.env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    # 将本机3306端口映射到容器的3306端口
    ports:
      - "127.0.0.1:3306:3306"

    # 使用Docker数据卷保存数据库文件
    volumes:
      - mysql_data:/var/lib/mysql

    # 设置数据库默认字符集，保证正常保存中文
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci

    # 定期检查MySQL是否已经可以接受连接
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  garage:
    # Garage是当前实际保存图片的S3兼容对象存储服务器
    image: dxflrs/garage:v2.4.1
    container_name: s3-image-hosting-garage
    restart: unless-stopped

    # 首次启动时自动创建S3访问密钥和默认Bucket
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY_ID}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET}

    # 3900是Garage提供的S3 API端口
    ports:
      - "127.0.0.1:3900:3900"

    # 配置、元数据和图片文件分别持久化保存
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data

    # 单机模式启动，并自动创建默认Bucket
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket

    # 检查Garage服务是否正常
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    # Redis用于缓存和接口限流
    image: redis:8.10.1-alpine
    container_name: s3-image-hosting-redis
    restart: unless-stopped

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    # 只允许本机访问Redis
    ports:
      - "127.0.0.1:6379:6379"

    # 开启AOF持久化，并要求客户端提供密码
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep PONG",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s


  backend:
    # 根据backend/Dockerfile构建FastAPI镜像
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: s3-image-hosting-backend
    restart: unless-stopped

    # 将根目录.env中的配置注入容器
    env_file:
      - .env

    # 容器之间不能使用127.0.0.1，
    # 需要通过Docker Compose服务名通信
    environment:
      APP_ENV: docker
      DEBUG: "false"

      MYSQL_HOST: mysql
      MYSQL_PORT: 3306

      REDIS_HOST: redis
      REDIS_PORT: 6379

      S3_ENDPOINT_URL: http://garage:3900
      S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:3900

    # 等三个依赖服务健康后再启动后端
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      garage:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nginx:
    # 使用Nginx官方轻量级镜像
    image: nginx:1.28-alpine
    container_name: s3-image-hosting-nginx
    restart: unless-stopped

    # 等FastAPI健康后再启动Nginx
    depends_on:
      backend:
        condition: service_healthy

    # 将本机8080端口映射到Nginx的80端口
    ports:
      - "127.0.0.1:8080:80"

    # 使用项目中的Nginx配置替换默认配置
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

    # 通过代理访问FastAPI健康检查
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # 即使容器停止，数据库数据仍保留在这个卷中
  mysql_data:

  # 保存Garage的数据库元数据
  garage_meta:

  # 保存上传到Garage的图片文件
  garage_data:

  # 保存Redis持久化数据
  redis_data: