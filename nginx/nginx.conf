server {
    # Nginx容器内部监听80端口
    listen 80;

    # 隐藏响应头中的Nginx版本
    server_tokens off;

    # Nginx需要允许略大于后端10MB限制的请求，
    # 因为multipart表单本身还会占用少量空间
    client_max_body_size 11m;

    # Vue构建后的静态文件所在目录
    root /usr/share/nginx/html;
    index index.html;

    # 浏览器中的/api前缀只用于区分前后端请求。
    # proxy_pass末尾的斜杠会在转发时去掉/api/前缀：
    # /api/auth/login -> FastAPI的/auth/login
    location /api/ {
        proxy_pass http://backend:8000/;

        # 使用HTTP/1.1向FastAPI转发请求
        proxy_http_version 1.1;

        # 向FastAPI传递原始请求信息
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 只信任Nginx实际看到的客户端地址，避免客户端伪造转发头
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 连接FastAPI的超时时间
        proxy_connect_timeout 5s;

        # 上传和下载图片时允许较长的响应时间
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 固定图片分享链接必须保留/s路径，
    # 因此这里的proxy_pass末尾不添加斜杠。
    location /s/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 保留FastAPI接口文档入口，便于开发和检查接口。
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vite生成的资源文件名带有内容哈希，可以长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 其他路径返回Vue页面。
    # 这样直接访问/images等前端路由时不会出现404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
